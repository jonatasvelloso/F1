site_name: F1 — OpenF1 Analytics
site_description: Dashboard das voltas mais rápidas por etapa, sobre a OpenF1 API
site_url: https://jonatasvelloso.github.io/F1/
repo_url: https://github.com/jonatasvelloso/F1
repo_name: jonatasvelloso/F1
edit_uri: edit/main/docs/docs/
site_dir: ../site

theme:
  name: material
  language: pt
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

nav:
  - Início: index.md
  - Arquitetura: architecture.md
  - Estrutura do Projeto: project-structure.md
  - Como Rodar Local: running-locally.md
  - Como Rodar Testes: running-tests.md
  - Como Contribuir: contributing.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
